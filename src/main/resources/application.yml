spring:
  application:
    name: nex-t-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nex_t}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao}
    expiration-minutes: 10080 # 7 dias
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  rollover:
    cron: "0 0 4 * * *" # 4h da manhã, horário do servidor

server:
  port: ${PORT:8080}
